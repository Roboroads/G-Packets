<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="G-Packets: Habbo Protocol Packet Definitions, Interceptors &amp; Tools">
  <!-- Edit banner-source.svg, then run build.sh to rebuild banner.svg (text as shapes) and banner.png. -->
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="packetGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0" />
      <stop offset="100%" stop-color="#00d9f5" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b253b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20" />
      <feOffset dy="16" result="offsetBlur" />
      <feFlood flood-color="#000000" flood-opacity="0.6" />
      <feComposite in2="offsetBlur" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.45" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1280" height="640" fill="url(#bgGradient)" />
  <rect width="1280" height="640" fill="url(#grid)" />

  <!-- Ambient Glow Blobs -->
  <circle cx="215" cy="320" r="220" fill="#00d9f5" opacity="0.08" filter="url(#glowCyan)" />
  <circle cx="1020" cy="180" r="260" fill="#4facfe" opacity="0.06" filter="url(#glowCyan)" />
  <circle cx="760" cy="500" r="180" fill="#00f5a0" opacity="0.05" filter="url(#glowCyan)" />

  <!-- Decorative Network Nodes & Circuit Lines -->
  <g stroke="#334155" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6">
    <line x1="28" y1="36" x2="150" y2="88" />
    <line x1="150" y1="560" x2="40" y2="612" />
    <line x1="1252" y1="36" x2="1130" y2="76" />
    <line x1="1130" y1="604" x2="1252" y2="560" />
  </g>

  <!-- Node Dots -->
  <g fill="#38bdf8" opacity="0.7">
    <circle cx="28" cy="36" r="4" />
    <circle cx="40" cy="612" r="4" />
    <circle cx="1252" cy="36" r="4" />
    <circle cx="1252" cy="560" r="4" />
  </g>

  <!-- ==================== LEFT ICON: PACKET / G EMBLEM ==================== -->
  <g transform="translate(40, 128) scale(1.45)" filter="url(#dropShadow)">
    <!-- Outer Hexagon / Shield Frame -->
    <polygon points="120,10 230,75 230,205 120,270 10,205 10,75"
             fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.8" />

    <!-- Inner Data Grid / Isometric Packet Cube -->
    <!-- Top Face -->
    <polygon points="120,48 185,85 120,122 55,85"
             fill="#00f2fe" fill-opacity="0.25" stroke="#00f2fe" stroke-width="2" />
    <!-- Left Face -->
    <polygon points="55,88 120,125 120,200 55,163"
             fill="#00d9f5" fill-opacity="0.12" stroke="#00d9f5" stroke-width="2" />
    <!-- Right Face -->
    <polygon points="120,125 185,88 185,163 120,200"
             fill="#4facfe" fill-opacity="0.2" stroke="#4facfe" stroke-width="2" />

    <!-- Stylized "G" and Packet Data Stream Inside Face -->
    <path d="M 142 98 L 165 111 L 165 138 L 120 164 L 75 138 L 75 111 L 98 98 L 98 111 L 89 116 L 89 130 L 120 148 L 151 130 L 151 123 L 120 105 L 120 92 L 142 79 Z"
          fill="url(#packetGreen)" opacity="0.95" filter="url(#softGlow)" />

    <!-- Incoming / Outgoing Indicator Badges -->
    <g transform="translate(0, 240)">
      <!-- Incoming [In] Badge -->
      <rect x="18" y="0" width="85" height="24" rx="12" fill="#032b28" stroke="#00f5a0" stroke-width="1.2" />
      <text x="60" y="16" fill="#00f5a0" font-family="'Fira Code', monospace" font-size="11" font-weight="700" text-anchor="middle">← INCOMING</text>

      <!-- Outgoing [Out] Badge -->
      <rect x="135" y="0" width="85" height="24" rx="12" fill="#2b1a03" stroke="#ff9900" stroke-width="1.2" />
      <text x="178" y="16" fill="#ffaa33" font-family="'Fira Code', monospace" font-size="11" font-weight="700" text-anchor="middle">OUTGOING →</text>
    </g>

    <!-- Packet Pulsing Data Bits -->
    <circle cx="120" cy="48" r="4.5" fill="#00f5a0" filter="url(#softGlow)" />
    <circle cx="185" cy="85" r="4.5" fill="#00f2fe" filter="url(#softGlow)" />
    <circle cx="55" cy="85" r="4.5" fill="#00d9f5" filter="url(#softGlow)" />
    <circle cx="120" cy="200" r="4.5" fill="#38bdf8" filter="url(#softGlow)" />
  </g>

  <!-- ==================== RIGHT SIDE: TYPOGRAPHY & SPECS ==================== -->
  <g transform="translate(430, 86)">
    <!-- Small Category Pill -->
    <rect x="0" y="0" width="330" height="34" rx="17" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.2" />
    <text x="165" y="22" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="14" font-weight="600" letter-spacing="2" text-anchor="middle">LIBRARY FOR G-EARTH EXTENSIONS</text>

    <!-- Main Title -->
    <text x="-4" y="124" fill="#ffffff" font-family="'Noto Sans', system-ui, sans-serif" font-size="104" font-weight="900" letter-spacing="-1.5">G<tspan fill="#38bdf8">-</tspan><tspan fill="url(#packetGreen)">Packets</tspan></text>

    <!-- Subtitle / Descriptor -->
    <text x="0" y="170" fill="#94a3b8" font-family="'Noto Sans', system-ui, sans-serif" font-size="26" font-weight="400" letter-spacing="0.2">Habbo Protocol Packet Definitions, Interceptors &amp; Tools</text>

    <!-- Editor Window: an @Intercept handler and the packet's schema -->
    <g transform="translate(0, 196)" font-family="'Fira Code', monospace">
      <rect x="0" y="0" width="810" height="208" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" />
      <path d="M 0 40 H 810" stroke="#1e293b" stroke-width="1.5" />
      <path d="M 520 40 V 208" stroke="#1e293b" stroke-width="1.5" />

      <!-- Window Controls -->
      <circle cx="22" cy="20" r="5" fill="#ef4444" opacity="0.8" />
      <circle cx="40" cy="20" r="5" fill="#eab308" opacity="0.8" />
      <circle cx="58" cy="20" r="5" fill="#22c55e" opacity="0.8" />
      <text x="84" y="25" fill="#64748b" font-size="14">YourExtension.java</text>
      <text x="542" y="25" fill="#64748b" font-size="14">Chat.TYPE.schema()</text>

      <!-- Handler -->
      <g font-size="18" fill="#e2e8f0">
        <text x="24" y="74"><tspan fill="#fbbf24">@Intercept</tspan></text>
        <text x="24" y="101"><tspan fill="#c084fc">void&#160;</tspan><tspan fill="#38bdf8">onChat</tspan>(<tspan fill="#00f5a0">Chat</tspan> chat, <tspan fill="#00f5a0">HMessage</tspan> message) {</text>
        <text x="67" y="128">chat.<tspan fill="#38bdf8">text</tspan>(chat.<tspan fill="#38bdf8">text</tspan>().<tspan fill="#38bdf8">toUpperCase</tspan>());</text>
        <text x="67" y="155">chat.<tspan fill="#38bdf8">replaceIn</tspan>(message);</text>
        <text x="24" y="182">}</text>
      </g>

      <!-- Schema -->
      <g font-size="15">
        <text x="542" y="74" fill="#00f5a0" font-weight="700">Chat <tspan fill="#ffaa33" font-weight="400">→ server</tspan></text>
        <text x="542" y="108" fill="#e2e8f0">text</text>
        <text x="660" y="108" fill="#38bdf8">String</text>
        <text x="542" y="138" fill="#e2e8f0">style</text>
        <text x="660" y="138" fill="#38bdf8">ChatBarStyle</text>
        <text x="542" y="168" fill="#e2e8f0">trackingId</text>
        <text x="660" y="168" fill="#38bdf8">int</text>
      </g>
    </g>

    <!-- Feature Badges Underneath -->
    <g transform="translate(0, 424)" font-family="'Noto Sans', system-ui, sans-serif" font-size="17" font-weight="600">
      <!-- Badge 1: in/out arrows -->
      <rect x="0" y="0" width="266" height="40" rx="8" fill="#1e293b" />
      <g transform="translate(16, 12)" fill="none" stroke="#00f5a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 0 4 H 16 M 12 0 L 16 4 L 12 8" />
        <path d="M 16 13 H 0 M 4 9 L 0 13 L 4 17" />
      </g>
      <text x="44" y="26" fill="#cbd5e1">Make interception easier</text>

      <!-- Badge 2: braces -->
      <rect x="280" y="0" width="234" height="40" rx="8" fill="#1e293b" />
      <text x="296" y="26" fill="#38bdf8" font-family="'Fira Code', monospace" font-weight="700">{}</text>
      <text x="326" y="26" fill="#cbd5e1">Fully typed packets</text>

      <!-- Badge 3: field list -->
      <rect x="528" y="0" width="282" height="40" rx="8" fill="#1e293b" />
      <g transform="translate(544, 12)" fill="#ffaa33">
        <circle cx="2" cy="2" r="2" />
        <circle cx="2" cy="8" r="2" />
        <circle cx="2" cy="14" r="2" />
        <rect x="6" y="1" width="12" height="2" rx="1" />
        <rect x="6" y="7" width="9" height="2" rx="1" />
        <rect x="6" y="13" width="11" height="2" rx="1" />
      </g>
      <text x="572" y="26" fill="#cbd5e1">Includes packet schemas</text>
    </g>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="634" width="1280" height="6" fill="url(#packetGreen)" />
</svg>
