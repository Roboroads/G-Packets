version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      # All minor and patch bumps land in a single PR.
      # Majors fall outside the group, so each gets its own PR per package.
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    ignore:
      # G-Earth is not on a public registry (local repo / JitPack), so Dependabot
      # cannot resolve it.
      - dependency-name: "G-Earth:G-Earth"
      # JUnit 6 needs Java 17 and the library builds on Java 8. Remove this
      # rule when the Java version goes up. #6 and #7 also left an ignore in
      # GitHub's Dependabot state; clear it then by commenting
      # `@dependabot unignore org.junit.jupiter:junit-jupiter-api` and
      # `@dependabot unignore org.junit.jupiter:junit-jupiter-engine` on any
      # open Dependabot PR.
      - dependency-name: "org.junit.jupiter:*"
        update-types:
          - "version-update:semver-major"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # The MkDocs Material pin for the documentation site.
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
    commit-message:
      prefix: docs
