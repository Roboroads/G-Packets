name: Docs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Not "build": maven.yml's job is a required check named "build", and check names must stay unique.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Generate the packet reference
        run: |
          mvn -B test-compile dependency:build-classpath -Dmdep.outputFile=target/docs-classpath.txt
          java -cp "target/classes:target/test-classes:$(cat target/docs-classpath.txt)" \
            me.roboroads.gearth.gpackets.docs.PacketReference docs/packets

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install MkDocs
        run: pip install -r docs/requirements.txt

      - name: Build the site
        run: mkdocs build --strict

      # The packet reference is generated, so it isn't in the repo. Serve the markdown as well, for
      # tools that keep an offline copy of the docs.
      - name: Publish the packet reference as markdown
        run: |
          mkdir -p site/md
          cp -r docs/packets site/md/packets

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
